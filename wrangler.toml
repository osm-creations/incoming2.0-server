name = "incoming2-0-server"
main = "src/index.ts"
compatibility_date = "2026-09-30"
keep_vars = true

# In the Worker's Settings > Variables and Secrets, add the Text variable
# INJECT_SELECTION_URL_TEMPLATE to override https://11z.co/_w/{userId}/selection.
# Use {userId} once in an HTTPS path or query. Leave the variable out of [vars]
# so that the dashboard value survives future Git deployments.

# Runtime configuration (safe to commit; these are NOT secrets).
# Replace example domains / Apple Team ID before production deployment.
[vars]
# Use the exact User ID or email of the account that opens the plain presentation.
PLAIN_PRESENTATION_ACCOUNT = "105"
PUBLIC_BASE_URL = "https://incoming2-0-server.incoming-osmcreations.workers.dev"
# The password recovery endpoints accept requests without cookies. All other
# endpoints keep the existing ALLOWED_ORIGINS checks for authenticated clients.
CORS_ALLOWED_ORIGINS = "*"
# Optional dashboard Text override: RESET_PUBLIC_URL. Defaults to
# https://incoming-2-0-password-reset.incoming-osmcreations.workers.dev/
# SMTP Text variables are optional dashboard overrides (kept across Git deployments).
# Defaults: SMTP_HOST=smtpout.secureserver.net, SMTP_PORT=465, SMTP_SECURITY=tls
# SMTP_FROM_EMAIL=support@osmcreations.com, SMTP_FROM_NAME=Incoming,
# SMTP_EHLO_DOMAIN=osmcreations.com, SMTP_AUTH_METHOD=auto, SMTP_ALLOW_DIFFERENT_FROM=false.
ALLOWED_ORIGINS = "https://incoming2-0-admin.incoming-osmcreations.workers.dev"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
APP_CLIP_SESSION_TTL_SECONDS = "1200"
APP_CLIP_APP_ID = "F34Q6U9QKH.com.osmcreations.incoming2.Clip"
PARENT_APP_ID = "F34Q6U9QKH.com.osmcreations.incoming2"

[[d1_databases]]
binding = "DB"
database_name = "incoming2-db"
database_id = "4e9fa1c0-fc36-43f6-b441-80e8ffb444d5"

# Runtime secrets are configured in Cloudflare Dashboard > Worker > Settings > Variables & Secrets.
# Never commit the real values.
# JWT_SECRET
# TOKEN_PEPPER
# CAPABILITY_SIGNING_SECRET
# SETUP_SECRET
# SMTP_USERNAME (full sending mailbox)
# SMTP_PASSWORD
